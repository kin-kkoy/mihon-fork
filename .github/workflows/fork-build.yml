name: Fork Build (Release APK)

# Builds an optimized, signed RELEASE APK on demand (Run workflow button)
# or when an apk-* tag is pushed. Release = minified/R8, not debuggable —
# dramatically faster than a debug build. Signed with a stable key from repo
# secrets so updates install over each other and keep your library.
# Free on public repos.
on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'
      - 'v*'

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          MIHON_GITHUB_RELEASE: "true"
          storeFileBase64: ${{ secrets.storeFileBase64 }}
          storePassword: ${{ secrets.storePassword }}
          keyAlias: ${{ secrets.keyAlias }}
          keyPassword: ${{ secrets.keyPassword }}
        run: ./gradlew assembleRelease --stacktrace -Penable-updater

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-fork-release-${{ github.sha }}
          # Per-ABI APKs + a universal one. Most phones use arm64-v8a;
          # the universal APK installs on any device if unsure.
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
