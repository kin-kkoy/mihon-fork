name: Fork Build (Debug APK)

# Builds an installable, auto-signed DEBUG APK on demand (Run workflow button)
# or when an apk-* tag is pushed. Not on every push — use the compile-check
# workflow for fast feedback; run this when you want an APK to test on-device.
# Free on public repos.
on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-fork-debug-${{ github.sha }}
          # Uploads per-ABI APKs + a universal one. Most phones use arm64-v8a;
          # the universal APK installs on any device if unsure.
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
